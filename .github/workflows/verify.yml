name: verify SihtiAI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: SihtiAI
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/Sihti
          ref: b3af6936c35c1eae63a40117e803309fd33f6244
          path: Sihti
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SihtiAI/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r SihtiAI/requirements.txt
      - name: Unit checks
        working-directory: SihtiAI
        run: python -m unittest discover -s tests -v
      - name: Two parameter smoke checks
        working-directory: SihtiAI
        run: |
          python persistence_head.py --scene stripes --height 24 --width 32 --beta 1 --output results/ci_beta1.json
          python persistence_head.py --scene stripes --height 24 --width 32 --beta 8 --output results/ci_beta8.json

      - name: Full five-scene reference run
        working-directory: SihtiAI
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python persistence_head.py --beta 1 --output results/ci_full_beta1.json
          python persistence_head.py --beta 8 --output results/ci_full_beta8.json
          python - <<'PY'
          import json
          for beta in (1, 8):
              rows = json.load(open(f"results/ci_full_beta{beta}.json"))["runs"]
              print("REFERENCE ARI BETA", beta)
              for scene in ("twins", "shade", "overlap", "stripes", "leaves"):
                  vals = {r["method"]:round(r["ari"], 4) for r in rows if r["scene"] == scene}
                  print(scene, "self", vals["self"], "unsigned", vals["unsigned_res"],
                        "signed", vals["signed_res"], "scrambled", vals["unsigned_scrambled"])
          PY
      - name: Archive measurements
        uses: actions/upload-artifact@v4
        with:
          name: sihtiai-reference-scores
          path: SihtiAI/results/ci_full_beta*.json

      - name: Causal predictive residue-head tests
        working-directory: SihtiAI/predictive
        run: |
          node test_head.js
          node benchmark.js
      - name: Archive predictive-memory measurements
        uses: actions/upload-artifact@v4
        with:
          name: residuehead-frozen-memory-scores
          path: SihtiAI/predictive/results/benchmark.json
